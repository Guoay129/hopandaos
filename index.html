<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>花熊精酿经营管理系统 V2.0</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#707783;--line:#e7e9ee;--brand:#1f6feb;--ok:#1a9b5a;--warn:#c78500;--bad:#d14343;--shadow:0 8px 30px rgba(22,30,50,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#e5e7eb;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
.brand{font-weight:800;font-size:20px;padding:8px 12px 22px}.brand small{display:block;font-size:12px;color:#9ca3af;margin-top:6px;font-weight:500}
.nav button{display:block;width:100%;border:0;background:transparent;color:#d1d5db;text-align:left;padding:12px 14px;border-radius:10px;font-size:15px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#263244;color:#fff}
.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:14px;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{color:#fff;background:var(--bad);border-color:var(--bad)}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}.kpi .hint{font-size:12px;margin-top:6px;color:var(--muted)}
.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,1fr)}
.section-title{font-size:18px;font-weight:800;margin:0 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eef2ff;color:#3949ab}.badge.ok{background:#e8f7ee;color:var(--ok)}.badge.warn{background:#fff5dd;color:var(--warn)}.badge.bad{background:#fdecec;color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}
.hidden{display:none!important}.panel{margin-bottom:18px}.empty{padding:38px;text-align:center;color:var(--muted)}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-size:13px;color:var(--muted);display:grid;gap:6px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--text)}textarea{min-height:80px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}.modal-box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;font-size:20px}.x{border:0;background:transparent;font-size:24px;cursor:pointer}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.table-card{display:flex;justify-content:space-between;gap:12px;align-items:center}.table-status{font-size:12px}
.list{display:grid;gap:10px}.list-item{padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.metric{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}
.progress{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--brand)}
.note{padding:12px 14px;border-radius:12px;background:#f7f8fb;border:1px solid var(--line);font-size:14px;line-height:1.65}.diagnosis{padding:14px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px}
footer{color:var(--muted);font-size:12px;padding:12px 0}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.two,.three{grid-template-columns:1fr}.sidebar{width:76px;padding:14px 8px}.brand{font-size:0;padding:8px}.brand:first-letter{font-size:24px}.brand small{display:none}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:20px}.main{margin-left:76px;width:calc(100% - 76px);padding:18px}}
@media(max-width:650px){.main{padding:14px}.top{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0;width:100%;padding-bottom:80px}.mobile-nav{display:flex!important;position:fixed;bottom:0;left:0;right:0;background:#111827;padding:6px;z-index:10;overflow:auto}.mobile-nav button{flex:0 0 auto;border:0;background:transparent;color:#cbd5e1;padding:9px 10px;border-radius:8px}.mobile-nav button.active{background:#263244;color:#fff}}
.mobile-nav{display:none}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">🐼 花熊精酿<small>经营管理系统 V2.0</small></div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="pageTitle">经营首页</h1><div class="sub" id="pageSub">订单、会员、库存和经营数据统一管理</div></div><div class="actions" id="topActions"></div></div>
  <div id="content"></div>
  <footer>V2.0 本地数据版 · 数据保存在当前浏览器 · 请定期导出 JSON 备份</footer>
</main>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div class="modal hidden" id="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='hopanda_os_v2';
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>'¥'+Number(n||0).toFixed(2);
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let state={page:'dashboard',data:null};

function seed(){
 return {
  tables:[{id:'t1',name:'1号桌',seats:4,status:'空闲'},{id:'t2',name:'2号桌',seats:4,status:'空闲'},{id:'t3',name:'3号桌',seats:6,status:'空闲'},{id:'t4',name:'4号桌',seats:4,status:'空闲'},{id:'t5',name:'吧台',seats:6,status:'空闲'}],
  members:[],
  categories:['精酿生啤','工业啤酒','果酒','无醇','其他'],
  products:[],
  purchases:[],
  inventory:[],
  orders:[],
  recharges:[],
  expenses:[],
  settings:{shopName:'花熊精酿',hbiWeights:{revenue:25,traffic:20,ticket:15,gross:20,inventory:10,repeat:10}}
 };
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state.data))}
state.data=load();

const pages=[
 ['dashboard','🏠','经营首页','核心经营指标'],
 ['tables','🪑','桌位与订单','开单、加酒、结账'],
 ['members','👤','会员','会员资料与消费'],
 ['recharge','💰','充值','会员充值记录'],
 ['products','🍺','酒款','酒款、售价与成本'],
 ['inventory','📦','采购库存','采购、库存与损耗'],
 ['analytics','📊','经营分析','销售、星期与酒款'],
 ['diagnosis','🧠','经营诊断','规则化经营诊断'],
 ['simulator','🔮','经营模拟','定价与盈亏模拟'],
 ['data','⚙️','数据管理','导入、导出与备份']
];
function renderNav(){
 const html=pages.map(([id,icon,name])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${icon} ${name}</button>`).join('');
 document.getElementById('nav').innerHTML=html; document.getElementById('mobileNav').innerHTML=html;
}
function go(page){state.page=page;render()}
function setTop(actions=[]){document.getElementById('topActions').innerHTML=actions.join('')}
function render(){
 renderNav(); const p=pages.find(x=>x[0]===state.page); document.getElementById('pageTitle').textContent=p[2];document.getElementById('pageSub').textContent=p[3];
 const map={dashboard:dashboard,tables:tables,members:members,recharge:recharge,products:products,inventory:inventory,analytics:analytics,diagnosis:diagnosis,simulator:simulator,data:dataPage};
 map[state.page]();
}
function completedOrders(rangeDays=0){
 let arr=state.data.orders.filter(o=>o.status==='已完成'); if(rangeDays){const d=new Date();d.setDate(d.getDate()-rangeDays+1);arr=arr.filter(o=>new Date(o.date)>=d)} return arr;
}
function orderRevenue(o){return o.total||0}
function orderCost(o){return (o.items||[]).reduce((s,i)=>s+(i.cost||0)*i.qty,0)}
function dashboard(){
 setTop([`<button class="btn primary" onclick="openOrderModal()">＋ 新建订单</button>`]);
 const os=completedOrders(), day=os.filter(o=>o.date===today());
 const rev=day.reduce((s,o)=>s+o.total,0), cost=day.reduce((s,o)=>s+orderCost(o),0), gp=rev-cost;
 const customers=day.reduce((s,o)=>s+(o.customerCount||1),0);
 const active=state.data.members.filter(m=>m.lastVisit&&((Date.now()-new Date(m.lastVisit).getTime())/86400000<30)).length;
 document.getElementById('content').innerHTML=`
 <div class="grid kpis">
 ${kpi('今日营业额',money(rev),'已完成订单')}
 ${kpi('今日订单',day.length+' 单','')}
 ${kpi('今日客流',customers+' 人','按订单录入人数')}
 ${kpi('今日客单',customers?money(rev/customers):'¥0.00','营业额 ÷ 客流')}
 ${kpi('理论毛利',money(gp),rev?('毛利率 '+(gp/rev*100).toFixed(1)+'%'):'等待销售数据')}
 </div>
 <div class="grid two" style="margin-top:16px">
 <section class="card"><h2 class="section-title">经营快照</h2>
 ${metric('近30天营业额',money(completedOrders(30).reduce((s,o)=>s+o.total,0)))}
 ${metric('近30天订单',completedOrders(30).length+' 单')}
 ${metric('活跃会员（30天）',active+' 人')}
 ${metric('库存采购批次',state.data.inventory.length+' 批')}
 </section>
 <section class="card"><h2 class="section-title">老板关注点</h2>${dashboardNotes()}</section>
 </div>
 <section class="card" style="margin-top:16px"><h2 class="section-title">最近订单</h2>${ordersTable(os.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8))}</section>`;
}
function kpi(label,value,hint){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function metric(a,b){return `<div class="metric"><span>${a}</span><strong>${b}</strong></div>`}
function dashboardNotes(){
 const notes=[]; const inv=state.data.inventory;
 const low=inv.filter(x=>x.remaining<=x.minStock).length;if(low)notes.push(`🔴 ${low} 个库存批次达到最低库存线。`);
 const slow=inv.filter(x=>x.purchaseDate&&((Date.now()-new Date(x.purchaseDate))/86400000>30)&&x.remaining>0).length;if(slow)notes.push(`🟡 ${slow} 个批次采购超过30天仍有库存。`);
 if(!notes.length)notes.push('🟢 当前没有触发基础库存预警。开始录入采购和订单后，系统会自动增加经营诊断。');
 return `<div class="list">${notes.map(x=>`<div class="note">${x}</div>`).join('')}</div>`;
}

function tables(){
 setTop([`<button class="btn" onclick="openTableModal()">＋ 新增桌位</button>`,`<button class="btn primary" onclick="openOrderModal()">＋ 新建订单</button>`]);
 const cards=state.data.tables.map(t=>{
 const open=state.data.orders.find(o=>o.tableId===t.id&&o.status==='进行中');
 return `<div class="card table-card"><div><strong>${esc(t.name)}</strong><div class="table-status">${t.seats}座 · ${open?'进行中':'空闲'}</div></div><div>${open?`<button class="btn primary" onclick="editOrder('${open.id}')">继续订单</button>`:`<button class="btn" onclick="openOrderModal('${t.id}')">开单</button>`}</div></div>`
 }).join('');
 document.getElementById('content').innerHTML=`<div class="grid three">${cards||'<div class="empty">暂无桌位</div>'}</div><section class="card" style="margin-top:16px"><h2 class="section-title">订单记录</h2>${ordersTable(state.data.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)))}</section>`;
}
function ordersTable(os){if(!os.length)return `<div class="empty">暂无订单</div>`;return `<div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>桌位</th><th>金额</th><th>人数</th><th>状态</th><th>操作</th></tr></thead><tbody>${os.map(o=>`<tr><td>${o.date}</td><td>${esc((state.data.tables.find(t=>t.id===o.tableId)||{}).name||'散客')}</td><td>${money(o.total)}</td><td>${o.customerCount||1}</td><td><span class="badge ${o.status==='已完成'?'ok':'warn'}">${o.status}</span></td><td>${o.status==='进行中'?`<button class="btn" onclick="editOrder('${o.id}')">继续</button>`:`<button class="btn" onclick="viewOrder('${o.id}')">查看</button>`}</td></tr>`).join('')}</tbody></table></div>`}

function members(){
 setTop([`<button class="btn primary" onclick="openMemberModal()">＋ 新增会员</button>`]);
 const ms=state.data.members;
 document.getElementById('content').innerHTML=`<section class="card"><h2 class="section-title">会员列表</h2><div class="table-wrap"><table class="table"><thead><tr><th>姓名</th><th>手机号</th><th>余额</th><th>累计消费</th><th>最近到店</th><th>操作</th></tr></thead><tbody>${ms.length?ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${money(m.balance)}</td><td>${money(m.totalSpend||0)}</td><td>${m.lastVisit||'-'}</td><td><button class="btn" onclick="memberDetail('${m.id}')">详情</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">暂无会员</div></td></tr>`}</tbody></table></div></section>`;
}
function recharge(){
 setTop([`<button class="btn primary" onclick="openRechargeModal()">＋ 会员充值</button>`]);
 document.getElementById('content').innerHTML=`<section class="card"><h2 class="section-title">充值记录</h2><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>会员</th><th>充值</th><th>赠送</th><th>支付方式</th><th>备注</th></tr></thead><tbody>${state.data.recharges.length?state.data.recharges.slice().reverse().map(r=>{const m=state.data.members.find(x=>x.id===r.memberId);return `<tr><td>${r.date}</td><td>${esc(m?.name||'-')}</td><td>${money(r.amount)}</td><td>${money(r.bonus)}</td><td>${esc(r.payMethod)}</td><td>${esc(r.note||'')}</td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">暂无充值记录</div></td></tr>`}</tbody></table></div></section>`;
}
function products(){
 setTop([`<button class="btn" onclick="openCategoryModal()">＋ 新增品类</button>`,`<button class="btn primary" onclick="openProductModal()">＋ 新增酒款</button>`]);
 const ps=state.data.products;
 document.getElementById('content').innerHTML=`<section class="card"><h2 class="section-title">酒款</h2><div class="table-wrap"><table class="table"><thead><tr><th>名称</th><th>品类</th><th>风格</th><th>ABV</th><th>售价</th><th>理论单位成本</th><th>状态</th><th>操作</th></tr></thead><tbody>${ps.length?ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.style||'-')}</td><td>${p.abv||'-'}</td><td>${money(p.price)}</td><td>${money(productUnitCost(p))}</td><td><span class="badge ${p.status==='在售'?'ok':'warn'}">${p.status}</span></td><td><button class="btn" onclick="openProductModal('${p.id}')">编辑</button></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty">暂无酒款</div></td></tr>`}</tbody></table></div></section>`;
}
function productUnitCost(p){const inv=state.data.inventory.filter(x=>x.productId===p.id&&x.remaining>0);if(!inv.length)return 0;const totalQty=inv.reduce((s,x)=>s+x.remaining,0);return inv.reduce((s,x)=>s+x.unitCost*x.remaining,0)/(totalQty||1)}
function inventory(){
 setTop([`<button class="btn primary" onclick="openPurchaseModal()">＋ 采购入库</button>`]);
 const inv=state.data.inventory;
 document.getElementById('content').innerHTML=`<section class="card"><h2 class="section-title">库存批次</h2><div class="note">库存采用批次管理。订单结账时按当前酒款理论单位成本扣减最早可用批次；V2.0 本地版用于经营分析，不替代财务账。</div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>酒款</th><th>采购日期</th><th>数量</th><th>剩余</th><th>单位成本</th><th>最低库存</th><th>状态</th></tr></thead><tbody>${inv.length?inv.map(x=>{const p=state.data.products.find(p=>p.id===x.productId);const status=x.remaining<=x.minStock?'预警':'正常';return `<tr><td>${esc(p?.name||'未知')}</td><td>${x.purchaseDate}</td><td>${x.qty}</td><td>${x.remaining}</td><td>${money(x.unitCost)}</td><td>${x.minStock}</td><td><span class="badge ${status==='预警'?'bad':'ok'}">${status}</span></td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty">暂无库存</div></td></tr>`}</tbody></table></div></section>`;
}
function analytics(){
 setTop([]);
 const os=completedOrders(), last30=completedOrders(30);
 const byDate={};last30.forEach(o=>{byDate[o.date]=(byDate[o.date]||0)+o.total});
 const byProduct={};last30.forEach(o=>(o.items||[]).forEach(i=>{byProduct[i.productId]=(byProduct[i.productId]||{qty:0,revenue:0,cost:0});byProduct[i.productId].qty+=i.qty;byProduct[i.productId].revenue+=i.qty*i.price;byProduct[i.productId].cost+=i.qty*i.cost}));
 const top=Object.entries(byProduct).map(([id,v])=>({p:state.data.products.find(x=>x.id===id),...v})).sort((a,b)=>b.revenue-a.revenue);
 document.getElementById('content').innerHTML=`
 <div class="grid two">
 <section class="card"><h2 class="section-title">近30天营业额</h2>${Object.keys(byDate).sort().length?Object.keys(byDate).sort().map(d=>{const v=byDate[d];const max=Math.max(...Object.values(byDate));return `<div class="metric"><span>${d}</span><div style="min-width:180px"><div class="progress"><span style="width:${max?v/max*100:0}%"></span></div><div style="text-align:right;font-size:12px;margin-top:4px">${money(v)}</div></div></div>`}).join(''):`<div class="empty">暂无近30天订单</div>`}</section>
 <section class="card"><h2 class="section-title">近30天核心指标</h2>${metric('营业额',money(last30.reduce((s,o)=>s+o.total,0)))}${metric('订单',last30.length+' 单')}${metric('理论毛利',money(last30.reduce((s,o)=>s+o.total-orderCost(o),0)))}${metric('平均客单',last30.length?money(last30.reduce((s,o)=>s+o.total,0)/last30.reduce((s,o)=>s+(o.customerCount||1),0)):'¥0.00')}</section>
 </div>
 <section class="card" style="margin-top:16px"><h2 class="section-title">酒款经营表现（近30天）</h2><div class="table-wrap"><table class="table"><thead><tr><th>酒款</th><th>销量</th><th>销售额</th><th>理论毛利</th><th>毛利率</th></tr></thead><tbody>${top.length?top.map(x=>`<tr><td>${esc(x.p?.name||'未知')}</td><td>${x.qty}</td><td>${money(x.revenue)}</td><td>${money(x.revenue-x.cost)}</td><td>${x.revenue?((x.revenue-x.cost)/x.revenue*100).toFixed(1):0}%</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">暂无数据</div></td></tr>`}</tbody></table></div></section>`;
}
function diagnosis(){
 setTop([]);
 const os=completedOrders(30), revenue=os.reduce((s,o)=>s+o.total,0), cost=os.reduce((s,o)=>s+orderCost(o),0), gp=revenue-cost;
 const customers=os.reduce((s,o)=>s+(o.customerCount||1),0), ticket=customers?revenue/customers:0;
 const members=state.data.members, repeat=members.length?members.filter(m=>m.lastVisit&&((Date.now()-new Date(m.lastVisit))/86400000<=30)).length/members.length:0;
 const inv=state.data.inventory, healthyInv=inv.length?inv.filter(x=>x.remaining>x.minStock).length/inv.length:1;
 const hbi=Math.round((Math.min(revenue/30000,1)*25)+(Math.min(customers/500,1)*20)+(Math.min(ticket/80,1)*15)+(Math.max(0,Math.min(gp/(revenue||1),1))*20)+(healthyInv*10)+(repeat*10));
 const notes=[];
 if(revenue===0)notes.push(['🟡','数据不足','近30天没有已完成订单，当前诊断只能作为数据结构检查，不能判断经营好坏。']);
 else{
  if(gp/revenue<0.35)notes.push(['🔴','理论毛利偏低','检查酒款成本录入、售价、赠送和损耗。理论毛利不等于实际净利润。']);
  if(ticket<50)notes.push(['🟡','客单价偏低','先看低客单是否来自产品结构，再决定是否增加套餐或活动，不建议直接全面降价。']);
  if(healthyInv<0.7)notes.push(['🟡','库存预警较多','优先暂停补货并核对低库存或长期库存。']);
  if(!notes.length)notes.push(['🟢','暂未触发基础异常','继续积累至少30—90天数据，再比较趋势。']);
 }
 document.getElementById('content').innerHTML=`<div class="grid two"><section class="card"><h2 class="section-title">HBI 经营健康指数</h2><div class="value" style="font-size:64px;font-weight:900">${hbi}<span style="font-size:18px;color:var(--muted)"> / 100</span></div><div class="sub">HBI 是本系统内部管理框架，不是行业标准；当前权重为营收25%、客流20%、客单15%、理论毛利20%、库存10%、会员活跃10%。</div></section><section class="card"><h2 class="section-title">数据口径</h2>${metric('近30天营业额',money(revenue))}${metric('近30天客流',customers+' 人')}${metric('近30天客单',money(ticket))}${metric('近30天理论毛利率',revenue?(gp/revenue*100).toFixed(1)+'%':'-')}</section></div><section class="card" style="margin-top:16px"><h2 class="section-title">经营诊断</h2>${notes.map(n=>`<div class="diagnosis"><strong>${n[0]} ${n[1]}</strong><div class="sub">${n[2]}</div></div>`).join('')}</section>`;
}
function simulator(){
 setTop([]);
 document.getElementById('content').innerHTML=`<div class="grid two"><section class="card"><h2 class="section-title">桶啤定价模拟</h2><form id="simForm"><label>采购成本（元）<input name="cost" type="number" value="580" step="0.01"></label><label>桶容量（L）<input name="liters" type="number" value="20" step="0.1"></label><label>单杯容量（ml）<input name="cup" type="number" value="470"></label><label>售价（元）<input name="price" type="number" value="39" step="0.01"></label><div class="full"><button class="btn primary" type="submit">计算</button></div></form><div id="simResult" class="note" style="margin-top:14px"></div></section><section class="card"><h2 class="section-title">盈亏平衡模拟</h2><form id="beForm"><label>每月固定成本（元）<input name="fixed" type="number" value="4000"></label><label>目标利润（元）<input name="profit" type="number" value="5000"></label><label class="full">平均毛利率（%）<input name="margin" type="number" value="40" step="0.1"></label><div class="full"><button class="btn primary" type="submit">计算</button></div></form><div id="beResult" class="note" style="margin-top:14px"></div></section></div>`;
 setTimeout(()=>{
  const runSim=()=>{const f=new FormData(document.getElementById('simForm'));const c=+f.get('cost'),l=+f.get('liters')*1000, cup=+f.get('cup'),p=+f.get('price');const cups=cup?l/cup:0, unit=cups?c/cups:0, gp=p-unit;document.getElementById('simResult').innerHTML=`理论杯数：<strong>${cups.toFixed(2)} 杯</strong><br>理论单杯成本：<strong>${money(unit)}</strong><br>理论单杯毛利：<strong>${money(gp)}</strong><br>卖完销售额：<strong>${money(cups*p)}</strong><br>理论桶毛利：<strong>${money(cups*gp)}</strong><br><br>假设：全部售出、无损耗、无赠送。`};document.getElementById('simForm').onsubmit=e=>{e.preventDefault();runSim()};runSim();
  const runBE=()=>{const f=new FormData(document.getElementById('beForm'));const fixed=+f.get('fixed'),profit=+f.get('profit'),m=+f.get('margin')/100;const rev=m?(fixed+profit)/m:0;document.getElementById('beResult').innerHTML=`达到“固定成本 + 目标利润”所需营业额：<strong>${money(rev)}</strong><br>假设平均毛利率恒定为 ${(m*100).toFixed(1)}%。`};document.getElementById('beForm').onsubmit=e=>{e.preventDefault();runBE()};runBE();
 },0);
}
function dataPage(){
 setTop([]);
 document.getElementById('content').innerHTML=`<div class="grid two"><section class="card"><h2 class="section-title">数据备份</h2><div class="note">导出当前浏览器中的全部业务数据。建议每周备份一次，并在重大修改前再次备份。</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="exportData()">📦 导出 JSON</button><label class="btn">📥 导入 JSON<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label></div></section><section class="card"><h2 class="section-title">危险操作</h2><div class="note">清空仅删除当前浏览器中的本地数据，无法撤销。</div><button class="btn danger" style="margin-top:14px" onclick="resetData()">清空并恢复初始数据</button></section></div>`;
}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openTableModal(){openModal('新增桌位',`<form id="tableForm"><label>桌位名称 *<input name="name" required></label><label>座位数 *<input name="seats" type="number" min="1" value="4" required></label><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form>`);setTimeout(()=>document.getElementById('tableForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.data.tables.push({id:uid('t'),name:f.get('name'),seats:+f.get('seats'),status:'空闲'});save();closeModal();render()},0)}
function openMemberModal(){openModal('新增会员',`<form id="memberForm"><label>姓名 *<input name="name" required></label><label>手机号 *<input name="phone" required></label><label>性别<select name="gender"><option>未设置</option><option>男</option><option>女</option></select></label><label>生日<input name="birthday" type="date"></label><label class="full">备注<textarea name="note"></textarea></label><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form>`);setTimeout(()=>document.getElementById('memberForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.data.members.push({id:uid('m'),name:f.get('name'),phone:f.get('phone'),gender:f.get('gender'),birthday:f.get('birthday'),note:f.get('note'),balance:0,totalSpend:0,lastVisit:null});save();closeModal();render()},0)}
function openRechargeModal(){if(!state.data.members.length){alert('请先新增会员');return}openModal('会员充值',`<form id="rechargeForm"><label class="full">选择会员 *<select name="memberId">${state.data.members.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.phone)}</option>`).join('')}</select></label><label>充值金额 *<input name="amount" type="number" min="0" step="0.01" required></label><label>赠送金额<input name="bonus" type="number" min="0" step="0.01" value="0"></label><label>支付方式<select name="payMethod"><option>现金</option><option>微信</option><option>支付宝</option><option>其他</option></select></label><label>备注<input name="note"></label><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">确认充值</button></div></form>`);setTimeout(()=>document.getElementById('rechargeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),m=state.data.members.find(x=>x.id===f.get('memberId'));const a=+f.get('amount'),b=+f.get('bonus');m.balance+=a+b;state.data.recharges.push({id:uid('r'),memberId:m.id,amount:a,bonus:b,payMethod:f.get('payMethod'),note:f.get('note'),date:today()});save();closeModal();render()},0)}
function openCategoryModal(){openModal('新增品类',`<form id="catForm"><label>品类名称 *<input name="name" required></label><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form>`);setTimeout(()=>document.getElementById('catForm').onsubmit=e=>{e.preventDefault();const n=new FormData(e.target).get('name');if(!state.data.categories.includes(n))state.data.categories.push(n);save();closeModal();render()},0)}
function openProductModal(id){
 const p=id?state.data.products.find(x=>x.id===id):{name:'',category:state.data.categories[0]||'',style:'',origin:'',abv:'',price:'',tap:'',status:'在售',note:''};
 openModal(id?'编辑酒款':'新增酒款',`<form id="productForm"><label>酒款名称 *<input name="name" required value="${esc(p.name)}"></label><label>品类 *<select name="category">${state.data.categories.map(c=>`<option ${c===p.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>风格<input name="style" value="${esc(p.style)}"></label><label>产地<input name="origin" value="${esc(p.origin)}"></label><label>酒精度 (%)<input name="abv" type="number" step="0.1" value="${esc(p.abv)}"></label><label>售价 (元)<input name="price" type="number" step="0.01" required value="${esc(p.price)}"></label><label>酒头编号<input name="tap" value="${esc(p.tap)}"></label><label>状态<select name="status"><option ${p.status==='在售'?'selected':''}>在售</option><option ${p.status==='停售'?'selected':''}>停售</option></select></label><label class="full">备注<textarea name="note">${esc(p.note)}</textarea></label><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form>`);
 setTimeout(()=>document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={id:p.id||uid('p'),...Object.fromEntries(f.entries()),price:+f.get('price')};if(id)Object.assign(p,obj);else state.data.products.push(obj);save();closeModal();render()},0)
}
function openPurchaseModal(){if(!state.data.products.length){alert('请先新增酒款');return}openModal('采购入库',`<form id="purchaseForm"><label class="full">酒款 *<select name="productId">${state.data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>采购日期<input name="purchaseDate" type="date" value="${today()}"></label><label>供应商<input name="supplier"></label><label>采购数量 *<input name="qty" type="number" min="0.01" step="0.01" required></label><label>单位成本 *<input name="unitCost" type="number" min="0" step="0.01" required></label><label>最低库存<input name="minStock" type="number" min="0" step="0.01" value="0"></label><label>备注<input name="note"></label><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">入库</button></div></form>`);
 setTimeout(()=>document.getElementById('purchaseForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),qty=+f.get('qty');const x={id:uid('inv'),...Object.fromEntries(f.entries()),qty,remaining:qty,unitCost:+f.get('unitCost'),minStock:+f.get('minStock')};state.data.inventory.push(x);state.data.purchases.push({...x,id:uid('pur')});save();closeModal();render()},0)
}
function openOrderModal(tableId=''){
 const ps=state.data.products.filter(p=>p.status==='在售');if(!ps.length){alert('请先新增酒款');return}
 openModal('新建订单',`<form id="orderForm"><label>桌位<select name="tableId"><option value="">散客</option>${state.data.tables.map(t=>`<option value="${t.id}" ${t.id===tableId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>人数<input name="customerCount" type="number" min="1" value="1"></label><label>会员（可选）<select name="memberId"><option value="">非会员</option>${state.data.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><label>日期<input name="date" type="date" value="${today()}"></label><div class="full"><strong>商品</strong><div id="orderItems" class="list" style="margin-top:8px"></div><button type="button" class="btn" style="margin-top:10px" onclick="addOrderItem()">＋ 添加酒款</button></div><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn" name="status" value="进行中">暂存订单</button><button class="btn primary" name="status" value="已完成">直接结账</button></div></form>`);
 setTimeout(()=>{window.orderDraft=[{productId:ps[0].id,qty:1}];renderOrderItems();document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();const submitter=e.submitter;saveOrder(new FormData(e.target),submitter?.value||'进行中')};},0)
}
function addOrderItem(){const ps=state.data.products.filter(p=>p.status==='在售');window.orderDraft.push({productId:ps[0].id,qty:1});renderOrderItems()}
function renderOrderItems(){const ps=state.data.products.filter(p=>p.status==='在售');document.getElementById('orderItems').innerHTML=window.orderDraft.map((it,i)=>`<div class="list-item"><select onchange="orderDraft[${i}].productId=this.value">${ps.map(p=>`<option value="${p.id}" ${p.id===it.productId?'selected':''}>${esc(p.name)} · ${money(p.price)}</option>`).join('')}</select><input type="number" min="0.01" step="0.01" value="${it.qty}" onchange="orderDraft[${i}].qty=+this.value" style="max-width:100px"><button type="button" class="btn" onclick="orderDraft.splice(${i},1);renderOrderItems()">删除</button></div>`).join('')}
function saveOrder(f,status){
 if(!window.orderDraft.length){alert('至少添加一个商品');return}
 const items=window.orderDraft.map(it=>{const p=state.data.products.find(x=>x.id===it.productId);return {productId:p.id,name:p.name,qty:+it.qty,price:+p.price,cost:productUnitCost(p)}});const total=items.reduce((s,i)=>s+i.qty*i.price,0);
 const o={id:uid('o'),tableId:f.get('tableId'),memberId:f.get('memberId'),customerCount:+f.get('customerCount'),date:f.get('date'),items,total,status,createdAt:new Date().toISOString()};
 state.data.orders.push(o); if(status==='已完成')finalizeOrder(o); if(o.tableId){const t=state.data.tables.find(x=>x.id===o.tableId);if(t)t.status=status==='进行中'?'使用中':'空闲'} save();closeModal();render();
}
function editOrder(id){const o=state.data.orders.find(x=>x.id===id);if(!o)return;window.orderDraft=o.items.map(i=>({productId:i.productId,qty:i.qty}));const ps=state.data.products.filter(p=>p.status==='在售');openModal('继续订单',`<form id="editOrderForm"><label>人数<input name="customerCount" type="number" min="1" value="${o.customerCount||1}"></label><label>会员<select name="memberId"><option value="">非会员</option>${state.data.members.map(m=>`<option value="${m.id}" ${m.id===o.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><div class="full"><strong>商品</strong><div id="orderItems" class="list" style="margin-top:8px"></div><button type="button" class="btn" style="margin-top:10px" onclick="addOrderItem()">＋ 添加酒款</button></div><div class="full modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">结账</button></div></form>`);setTimeout(()=>{renderOrderItems();document.getElementById('editOrderForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);o.items=window.orderDraft.map(it=>{const p=state.data.products.find(x=>x.id===it.productId);return {productId:p.id,name:p.name,qty:+it.qty,price:+p.price,cost:productUnitCost(p)}});o.total=o.items.reduce((s,i)=>s+i.qty*i.price,0);o.customerCount=+f.get('customerCount');o.memberId=f.get('memberId');o.status='已完成';finalizeOrder(o);if(o.tableId){const t=state.data.tables.find(x=>x.id===o.tableId);if(t)t.status='空闲'}save();closeModal();render()}},0)}
function finalizeOrder(o){
 o.items.forEach(i=>{let need=i.qty;const batches=state.data.inventory.filter(x=>x.productId===i.productId&&x.remaining>0).sort((a,b)=>String(a.purchaseDate).localeCompare(String(b.purchaseDate)));batches.forEach(b=>{if(need<=0)return;const take=Math.min(need,b.remaining);b.remaining-=take;need-=take})});
 if(o.memberId){const m=state.data.members.find(x=>x.id===o.memberId);if(m){m.totalSpend=(m.totalSpend||0)+o.total;m.lastVisit=o.date;}}
}
function viewOrder(id){const o=state.data.orders.find(x=>x.id===id);if(!o)return;openModal('订单详情',`<div class="list">${o.items.map(i=>`<div class="list-item"><span>${esc(i.name)} × ${i.qty}</span><strong>${money(i.price*i.qty)}</strong></div>`).join('')}</div><div class="metric"><span>合计</span><strong>${money(o.total)}</strong></div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">关闭</button></div>`)}
function memberDetail(id){const m=state.data.members.find(x=>x.id===id);const os=state.data.orders.filter(o=>o.memberId===id&&o.status==='已完成');openModal('会员详情',`${metric('姓名',esc(m.name))}${metric('手机号',esc(m.phone))}${metric('余额',money(m.balance))}${metric('累计消费',money(m.totalSpend||0))}${metric('最近到店',m.lastVisit||'-')}<h3>消费记录</h3>${ordersTable(os)}`)}
function exportData(){const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hopanda-os-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state.data=JSON.parse(r.result);save();render();alert('导入成功')}catch(e){alert('文件格式错误，未导入')}};r.readAsText(file)}
function resetData(){if(confirm('确定清空当前浏览器中的全部数据？')){state.data=seed();save();render()}}
window.closeModal=closeModal;window.go=go;window.openOrderModal=openOrderModal;window.openTableModal=openTableModal;window.openMemberModal=openMemberModal;window.openRechargeModal=openRechargeModal;window.openCategoryModal=openCategoryModal;window.openProductModal=openProductModal;window.openPurchaseModal=openPurchaseModal;window.editOrder=editOrder;window.viewOrder=viewOrder;window.memberDetail=memberDetail;window.addOrderItem=addOrderItem;window.renderOrderItems=renderOrderItems;window.orderDraft=[];window.exportData=exportData;window.importData=importData;window.resetData=resetData;
render();
</script>
</body>
